name: dueb-app
services:
  db:
    build: ./database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dueb}
      POSTGRES_USER: ${DB_USER:-dueb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]
  caddy:
    build: ./frontend
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/srv-static:ro
      - ./certs:/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
  mail-worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    entrypoint: ["python", "manage.py", "process_observer_mail", "--loop"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/dueb-mail-heartbeat').stat().st_mtime < 120"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal]
volumes:
  postgres_data:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
networks:
  internal:
